<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Spleeter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #fff;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 2rem;
    }

    /* File input styled */
    .file-group {
      border: 2px dashed #333;
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }
    .file-group:hover { border-color: #6c63ff; }
    .file-group.ready { border-color: #4ade80; }
    .file-group label {
      display: block;
      font-size: 0.9rem;
      color: #888;
      cursor: pointer;
    }
    .file-group input[type="file"] {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: #aaa;
    }
    .file-hint {
      font-size: 0.75rem;
      color: #555;
      margin-top: 0.4rem;
    }
    .file-hint.ok { color: #4ade80; }

    /* Backend selector */
    .backend-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    .backend-opt {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #aaa;
      transition: border-color 0.2s, background 0.2s;
      flex: 1;
    }
    .backend-opt:has(input:checked) {
      border-color: #6c63ff;
      background: #1e1b33;
      color: #ddd;
    }
    .backend-opt input[type="radio"] { accent-color: #6c63ff; }
    .backend-opt small { color: #555; font-size: 0.75rem; }

    /* Button */
    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.8rem;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    button:hover:not(:disabled) { background: #5a52e0; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
    }
    .note.error { color: #e05a5a; }
  </style>
</head>
<body>

<div class="card">
  <h1>Audio Spleeter</h1>
  <p class="subtitle">Separa vocals · drums · bass · other</p>

  <div class="file-group" id="fileGroup">
    <label for="fileInput">Selecione um arquivo de audio</label>
    <input type="file" id="fileInput" accept=".wav,.mp3,.m4a" />
    <p class="file-hint" id="fileHint">.wav · .mp3 · .m4a</p>
  </div>

  <div class="backend-group">
    <label class="backend-opt">
      <input type="radio" name="backend" value="replicate" checked>
      <span>Replicate <small>(nuvem · ~9 min)</small></span>
    </label>
    <label class="backend-opt">
      <input type="radio" name="backend" value="local">
      <span>Local CPU <small>(offline · ~7 min)</small></span>
    </label>
  </div>

  <button type="button" id="btn" disabled>Selecione um arquivo</button>

  <p class="note" id="note">O arquivo sera lido para a memoria ao selecionar.</p>
</div>

<script>
  // Lê o arquivo para memória imediatamente ao selecionar,
  // evitando ERR_UPLOAD_FILE_CHANGED no Chrome Android.
  var fileInput = document.getElementById("fileInput");
  var fileGroup = document.getElementById("fileGroup");
  var fileHint = document.getElementById("fileHint");
  var btn = document.getElementById("btn");
  var note = document.getElementById("note");

  var fileBlob = null;
  var fileName = "";

  fileInput.addEventListener("change", function() {
    var file = fileInput.files[0];
    if (!file) return;

    btn.disabled = true;
    btn.textContent = "Lendo arquivo...";
    fileHint.textContent = "Lendo " + file.name + "...";
    fileHint.className = "file-hint";

    var reader = new FileReader();
    reader.onload = function() {
      fileBlob = new Blob([reader.result], { type: file.type || "application/octet-stream" });
      fileName = file.name;
      fileGroup.className = "file-group ready";
      fileHint.textContent = file.name + " (" + formatSize(file.size) + ") — pronto";
      fileHint.className = "file-hint ok";
      btn.disabled = false;
      btn.textContent = "Separar stems";
      note.textContent = "Arquivo carregado na memoria. Pode enviar.";
      note.className = "note";
    };
    reader.onerror = function() {
      fileHint.textContent = "Erro ao ler o arquivo. Tente novamente.";
      fileHint.className = "file-hint";
      btn.disabled = true;
      btn.textContent = "Selecione um arquivo";
    };
    reader.readAsArrayBuffer(file);
  });

  btn.addEventListener("click", function() {
    if (!fileBlob) return;

    btn.disabled = true;
    btn.textContent = "Enviando...";
    note.textContent = "Enviando " + formatSize(fileBlob.size) + "...";
    note.className = "note";

    var backend = document.querySelector('input[name="backend"]:checked').value;

    var formData = new FormData();
    formData.append("file", fileBlob, fileName);
    formData.append("backend", backend);

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "separate");
    xhr.timeout = 60000;

    xhr.onload = function() {
      if (xhr.status === 202) {
        try {
          var data = JSON.parse(xhr.responseText);
          window.location.href = "job/" + data.job_id;
        } catch (e) {
          note.textContent = "Erro: resposta inesperada do servidor.";
          note.className = "note error";
          btn.disabled = false;
          btn.textContent = "Tentar novamente";
        }
      } else {
        var msg = "Erro " + xhr.status;
        try { msg = JSON.parse(xhr.responseText).detail || msg; } catch(e) {}
        note.textContent = msg;
        note.className = "note error";
        btn.disabled = false;
        btn.textContent = "Tentar novamente";
      }
    };

    xhr.onerror = function() {
      note.textContent = "Falha na conexao. Verifique sua rede.";
      note.className = "note error";
      btn.disabled = false;
      btn.textContent = "Tentar novamente";
    };

    xhr.ontimeout = function() {
      note.textContent = "Timeout no envio. Tente com arquivo menor.";
      note.className = "note error";
      btn.disabled = false;
      btn.textContent = "Tentar novamente";
    };

    xhr.send(formData);
  });

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1048576).toFixed(1) + " MB";
  }
</script>

</body>
</html>
