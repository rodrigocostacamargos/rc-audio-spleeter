<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Spleeter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #fff;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 2rem;
    }

    /* File input styled */
    .file-group {
      border: 2px dashed #333;
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }
    .file-group:hover { border-color: #6c63ff; }
    .file-group label {
      display: block;
      font-size: 0.9rem;
      color: #888;
      cursor: pointer;
    }
    .file-group input[type="file"] {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: #aaa;
    }
    .file-hint {
      font-size: 0.75rem;
      color: #555;
      margin-top: 0.4rem;
    }

    /* Backend selector */
    .backend-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    .backend-opt {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #aaa;
      transition: border-color 0.2s, background 0.2s;
      flex: 1;
    }
    .backend-opt:has(input:checked) {
      border-color: #6c63ff;
      background: #1e1b33;
      color: #ddd;
    }
    .backend-opt input[type="radio"] { accent-color: #6c63ff; }
    .backend-opt small { color: #555; font-size: 0.75rem; }

    /* Button */
    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.8rem;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    button:hover:not(:disabled) { background: #5a52e0; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Audio Spleeter</h1>
  <p class="subtitle">Separa vocals · drums · bass · other</p>

  <form method="POST" action="upload" enctype="multipart/form-data" id="uploadForm">

    <div class="file-group">
      <label for="fileInput">Selecione um arquivo de audio</label>
      <input type="file" id="fileInput" name="file" accept=".wav,.mp3,.m4a" required />
      <p class="file-hint">.wav · .mp3 · .m4a</p>
    </div>

    <div class="backend-group">
      <label class="backend-opt">
        <input type="radio" name="backend" value="replicate" checked>
        <span>Replicate <small>(nuvem · ~9 min)</small></span>
      </label>
      <label class="backend-opt">
        <input type="radio" name="backend" value="local">
        <span>Local CPU <small>(offline · ~7 min)</small></span>
      </label>
    </div>

    <button type="submit" id="btn">Separar stems</button>
  </form>

  <p class="note">Apos clicar, aguarde o envio do arquivo. Voce sera redirecionado automaticamente.</p>
</div>

<script>
  document.getElementById("uploadForm").addEventListener("submit", function() {
    var btn = document.getElementById("btn");
    btn.disabled = true;
    btn.textContent = "Enviando arquivo...";
  });
</script>

</body>
</html>
